<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- A stompbox in the chain: the wire runs through it, the way the app
       draws a preset. Colours are the app's own theme. -->
  <rect x="0" y="0" width="128" height="128" rx="28" fill="#121418"/>
  <!-- the wire, entering and leaving -->
  <path d="M 4 64 H 24 M 104 64 H 124" stroke="#4a505c" stroke-width="7" stroke-linecap="round"/>
  <!-- the pedal -->
  <rect x="24" y="20" width="80" height="88" rx="12" fill="#2a2e36" stroke="#d8a83b" stroke-width="5"/>
  <!-- knobs -->
  <g stroke="#d8a83b" stroke-width="4" fill="#121418">
    <circle cx="46" cy="44" r="9"/>
    <circle cx="82" cy="44" r="9"/>
  </g>
  <g stroke="#d6d9df" stroke-width="3.5" stroke-linecap="round">
    <path d="M 46 44 L 41 37"/>
    <path d="M 82 44 L 87 37"/>
  </g>
  <!-- the footswitch -->
  <circle cx="64" cy="84" r="13" fill="#d8a83b"/>
  <circle cx="64" cy="84" r="6" fill="#121418"/>
</svg>
