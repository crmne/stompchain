[package]
name = "hx-gui"
description = "Edit the presets on a Line 6 Helix or HX guitar pedal, on Linux, macOS and Windows"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
hx-proto.workspace = true
hx-usb.workspace = true
hx-catalog.workspace = true
# Persist favorites (and, later, rig profiles and preferences) as one small
# JSON file the user could open and read.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# egui renders with wgpu/glow and has no native toolkit dependency, so the same
# tree builds for macOS, Windows, Linux and Android.
# The winit backends are named features from 0.30 on: with default features off
# and neither named, winit compiles for no platform at all and says so.
eframe = { version = "0.30", default-features = false, features = [
    "glow",
    "default_fonts",
    "wayland",
    "x11",
] }
egui = "0.30"
egui_extras = { version = "0.30", features = ["image", "file", "svg"] }
# Virtualised rows and sticky columns for the library table. egui_extras'
# TableBuilder builds every row whether or not it is on screen, which a library
# of a few thousand tones cannot afford.
egui_table = "0.2"
image = { version = "0.25", default-features = false, features = ["png"] }
# Native file dialogs, so import and export use the system picker rather than a
# path typed into a text box.
# The async-std flavour runs its own reactor, which the synchronous dialog
# calls need; the tokio flavour panics with "no reactor running" the moment
# any dialog opens outside a tokio runtime, which is everywhere in this app.
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
ureq = { version = "3.4.0", default-features = false, features = ["rustls", "platform-verifier"] }
sha2 = "0.10"

[lib]
name = "hx_gui"

[[bin]]
name = "tonepush-gui"
path = "src/main.rs"
