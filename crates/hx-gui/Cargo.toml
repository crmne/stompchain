[package]
name = "hx-gui"
description = "Cross-platform editor for Line 6 HX-family devices"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
hx-proto.workspace = true
hx-usb.workspace = true
hx-catalog.workspace = true
# Persist favorites (and, later, rig profiles and preferences) as one small
# JSON file the user could open and read.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# egui renders with wgpu/glow and has no native toolkit dependency, so the same
# tree builds for macOS, Windows, Linux and Android.
eframe = { version = "0.29", default-features = false, features = [
    "glow",
    "default_fonts",
] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["image", "file"] }
image = { version = "0.25", default-features = false, features = ["png"] }
# Native file dialogs, so import and export use the system picker rather than a
# path typed into a text box.
# The async-std flavour runs its own reactor, which the synchronous dialog
# calls need; the tokio flavour panics with "no reactor running" the moment
# any dialog opens outside a tokio runtime, which is everywhere in this app.
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
ureq = { version = "3.4.0", default-features = false, features = ["rustls", "platform-verifier"] }

[lib]
name = "hx_gui"

[[bin]]
name = "stompchain-gui"
path = "src/main.rs"
