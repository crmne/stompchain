[package]
name = "hx-catalog"
description = "Reads the model catalog HX Edit ships, for model and parameter metadata"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# The preset model the writer serialises. hx-proto is deliberately
# dependency-free and does not depend on hx-catalog, so this adds no cycle.
hx-proto.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true
