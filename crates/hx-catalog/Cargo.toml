[package]
name = "hx-catalog"
description = "What every amp and effect in a Line 6 Helix or HX guitar pedal is called, and what its knobs do"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# The preset model the writer serialises. hx-proto is deliberately
# dependency-free and does not depend on hx-catalog, so this adds no cycle.
hx-proto.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true
# Inflating the zlib blocks inside an HX Edit `.hxb` backup. The pure-Rust
# backend keeps this free of a system libz, so the reader builds anywhere.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
